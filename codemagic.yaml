# Codemagic build configuration.
#
# This exists because iOS can only be compiled on macOS and this team has no
# Mac. Codemagic runs the build on one of theirs. It removes the *machine*
# requirement — it does not remove Apple's account requirement, which is a
# separate thing and is why there are two iOS workflows below rather than one.
#
# See docs/ios.md for what each one needs before it will run.

definitions:
  # Pinned rather than "stable". A moving toolchain turns an unrelated upstream
  # change into a red build here, and this repo is read by people who would
  # have no way of telling the two apart.
  flutter_version: &flutter_version 3.44.9

  scripts:
    - &analyze
      name: Analyze and test
      script: |
        flutter pub get
        flutter analyze
        flutter test

    # GoogleService-Info.plist is not in the repository and the app cannot
    # start without it. It is stored as a base64 environment variable and
    # written back here — base64 because Codemagic variables are single-line
    # and the file is XML.
    - &write_firebase_plist
      name: Write GoogleService-Info.plist
      script: |
        if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
          echo "GOOGLE_SERVICE_INFO_PLIST is not set."
          echo "The app cannot start without it — see docs/ios.md."
          exit 1
        fi
        echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
          > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
        # Fails the build here, with a clear reason, rather than at launch on
        # a phone with an unreadable one.
        plutil -lint "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

workflows:
  # --------------------------------------------------------------------------
  # Does it build at all? Needs no Apple account whatsoever.
  #
  # The result is NOT installable on a phone — an unsigned app cannot be. Its
  # value is that nobody on this project has ever compiled the iOS side, so
  # this is what tells you whether the Podfile, the deployment target and the
  # Firebase setup are right, without spending $99 to find out.
  # --------------------------------------------------------------------------
  ios-unsigned:
    name: iOS — build check (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - supabase
        - firebase-ios
    scripts:
      - *analyze
      - *write_firebase_plist
      # Both Supabase values are compile-time constants read through
      # String.fromEnvironment, so they must be passed at build time. They come
      # from the `supabase` environment group, never from the repository —
      # env.json is gitignored precisely so keys never land here.
      #
      # The anon key is designed to ship inside a client app; it grants only
      # what the bucket policies allow. The service_role key must never be
      # added to any group named above.
      - name: Build unsigned
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  # --------------------------------------------------------------------------
  # The one that actually puts the app on people's phones.
  #
  # Requires the Apple Developer Program ($99/year). A free Apple ID cannot be
  # used here: Codemagic signs with an App Store Connect API key, and Apple
  # only issues those to paid accounts. Free-account signing works solely
  # through Xcode on a Mac, which is the situation this file exists to avoid.
  # --------------------------------------------------------------------------
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic-api-key
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - supabase
        - firebase-ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.behuman.beHumanApp
    scripts:
      - *analyze
      - *write_firebase_plist
      - name: Build the ipa
        # $BUILD_NUMBER is Codemagic's own counter and rises on every run.
        # pubspec.yaml's number is not used: TestFlight refuses a build number
        # it has already seen, so a fixed one means every upload after the
        # first is rejected.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Not submitted for App Store review: this is an internal tool for one
        # organisation, not a public app.
        submit_to_app_store: false

  # --------------------------------------------------------------------------
  # Android, so both platforms come off the same checks and the same keys.
  # --------------------------------------------------------------------------
  android-apk:
    name: Android — APK
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: *flutter_version
      groups:
        - supabase
    scripts:
      - *analyze
      - name: Build the APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
