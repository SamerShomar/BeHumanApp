name: be_human_app
description: "Be Human Foundation Management Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

flutter:
  assets:
    - assets/
    - assets/images/logo.png
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: 14.3.0

  # Data & Serialization
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  
  # UI & Styling
  flutter_screenutil: 5.9.3
  google_fonts: 6.2.1
  iconsax_flutter: ^1.0.0
  fl_chart: 0.69.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  
  # Utils & Media
  file_picker: 8.1.2
  image_picker: 1.1.2
  http: ^1.0.0
  html: ^0.15.0
  connectivity_plus: ^6.0.5
  intl: any

  # File storage (Firebase Storage requires the paid Blaze plan)
  supabase_flutter: ^2.8.0
  
  # Firebase (Strict Versioning)
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.4
  firebase_storage: 12.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
