# Build tuning.
#
# The heap was set to 8 GB with a 4 GB metaspace. That is not "more speed" —
# Gradle takes what it is given, and on a 16 GB laptop it then competes with
# the Dart AOT compiler, the Kotlin daemon and the OS for memory. Once the
# machine starts swapping, a release build that should take minutes stops
# finishing at all. This project needs nowhere near that much.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# Independent modules compile at the same time instead of one after another.
org.gradle.parallel=true

# Reuses task output between builds, so a second build only redoes what
# actually changed.
org.gradle.caching=true

# Only configures the modules a build actually needs.
org.gradle.configureondemand=true

android.useAndroidX=true
